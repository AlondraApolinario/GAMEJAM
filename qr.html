<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HypeVault QR Generator</title>
<style>
:root{--ink:#171827;--cream:#fff8e8;--paper:#fffdf7;--pink:#ff5f8f;--lime:#c8f169;--blue:#6e8bff;--muted:#777b91}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS",sans-serif;background:#f4e7ce;background-image:linear-gradient(135deg,rgba(255,255,255,.45) 25%,transparent 25%),linear-gradient(315deg,rgba(255,153,92,.13) 25%,transparent 25%);background-size:46px 46px}.page{width:min(900px,calc(100% - 28px));margin:auto;padding:32px 0 48px}.brand{font-weight:900;letter-spacing:2px;margin-bottom:30px}.brand span{color:var(--pink)}.generator{display:grid;grid-template-columns:1fr 370px;gap:0;background:var(--cream);border:4px solid var(--ink);box-shadow:9px 9px 0 var(--pink)}.form{padding:30px}.preview{display:grid;place-items:center;padding:28px;background:#d9d3fb;border-left:4px solid var(--ink);min-height:420px}.eyebrow{margin:0 0 9px;color:var(--pink);font:700 12px monospace;letter-spacing:2px}.form h1{margin:0;font-size:clamp(38px,6vw,62px);line-height:.9;letter-spacing:-2px;text-transform:uppercase}.form h1 span{color:var(--blue)}.lead{color:var(--muted);line-height:1.5;margin:18px 0 25px}.label{display:block;margin:18px 0 7px;font:700 12px monospace;letter-spacing:1px}.input,.select{width:100%;padding:13px;border:3px solid var(--ink);background:white;color:var(--ink);font:15px monospace}.input{min-height:115px;resize:vertical}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color-row{display:flex;gap:10px}.color{height:46px;flex:1;padding:3px;border:3px solid var(--ink);background:white;cursor:pointer}.color.selected{outline:4px solid var(--pink);outline-offset:2px}.color i{display:block;width:100%;height:100%}.color-dark i{background:#171827}.color-blue i{background:#6e8bff}.generate{width:100%;margin-top:23px;padding:14px;background:var(--lime);font-size:15px}.qr-box{display:grid;place-items:center;width:270px;height:270px;padding:15px;background:white;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--blue)}#qrcode img{display:block;max-width:100%;height:auto}.empty{text-align:center;color:var(--muted);font:700 13px monospace}.download{width:100%;max-width:270px;margin-top:22px;background:var(--pink);color:white;box-shadow:4px 4px 0 var(--ink)}.download:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}button{border:3px solid var(--ink);border-radius:4px;cursor:pointer;font:bold 14px "Trebuchet MS",sans-serif}button:hover:not(:disabled),button:focus-visible:not(:disabled){transform:translate(-1px,-1px)}.note{margin-top:22px;color:var(--muted);font:11px monospace}@media(max-width:760px){.generator{grid-template-columns:1fr}.preview{border-left:0;border-top:4px solid var(--ink);min-height:360px}.form{padding:24px}.qr-box{width:240px;height:240px}}
</style>
</head>
<body>
<main class="page">
<div class="brand">HYPE<span>VAULT</span> / QR LAB</div>
<section class="generator" aria-label="QR code generator">
<div class="form"><p class="eyebrow">MAKE IT SCANNABLE</p><h1>QR <span>Generator</span></h1><p class="lead">Turn a link, message, or contact detail into a clean QR code in seconds.</p><label class="label" for="content">CONTENT</label><textarea class="input" id="content" placeholder="Paste a link or type a message..." autofocus></textarea><div class="options"><div><label class="label" for="size">SIZE</label><select class="select" id="size"><option value="180">Small</option><option value="240" selected>Medium</option><option value="320">Large</option></select></div><div><label class="label" for="margin">MARGIN</label><select class="select" id="margin"><option value="1">Tight</option><option value="3" selected>Standard</option><option value="5">Wide</option></select></div></div><label class="label">QR COLOR</label><div class="color-row"><button class="color color-dark selected" data-color="#171827" aria-label="Dark QR color"><i></i></button><button class="color color-blue" data-color="#4056d8" aria-label="Blue QR color"><i></i></button></div><button class="generate" id="generate">GENERATE QR CODE</button><p class="note">Your text stays in this browser tab.</p></div>
<div class="preview"><div><div class="qr-box"><div id="qrcode" class="empty">YOUR QR CODE<br>APPEARS HERE</div></div><button class="download" id="download" disabled>DOWNLOAD PNG</button></div></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const content=document.getElementById('content'),size=document.getElementById('size'),margin=document.getElementById('margin'),qrcode=document.getElementById('qrcode'),download=document.getElementById('download');let color='#171827';
function generate(){const value=content.value.trim();if(!value){content.focus();return}qrcode.innerHTML='';new QRCode(qrcode,{text:value,width:Number(size.value),height:Number(size.value),colorDark:color,colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});qrcode.style.padding=`${Number(margin.value)*2}px`;download.disabled=false;download.dataset.ready='true'}
document.getElementById('generate').onclick=generate;document.querySelectorAll('.color').forEach(button=>button.onclick=()=>{color=button.dataset.color;document.querySelectorAll('.color').forEach(item=>item.classList.toggle('selected',item===button));if(download.dataset.ready)generate()});[size,margin].forEach(control=>control.onchange=()=>{if(download.dataset.ready)generate()});content.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='Enter')generate()});download.onclick=()=>{const image=qrcode.querySelector('img');if(!image)return;const link=document.createElement('a');link.href=image.src;link.download='hypevault-qr.png';link.click()};
</script>
</body>
</html>
