<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Toon Network: Neon Arcade</title>
	<style>
		:root {
			--ink: #141a27;
			--paper: #f7f2e8;
			--yellow: #ffd447;
			--coral: #ff6b55;
			--teal: #19b8a5;
			--blue: #3568f4;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			font-family: "Trebuchet MS", "Arial Black", sans-serif;
			background: var(--yellow);
			background-image: radial-gradient(#e9b823 1px, transparent 1px), linear-gradient(135deg, #ffd447, #ffb853);
			background-size: 18px 18px, 100% 100%;
		}

		.shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
		.brand { display: flex; align-items: center; gap: 12px; }
		.brand-mark { display: grid; place-items: center; width: 45px; height: 45px; color: white; background: var(--ink); border: 3px solid white; border-radius: 50%; box-shadow: 4px 4px 0 var(--coral); font-size: 23px; }
		.brand h1 { margin: 0; font-size: clamp(21px, 4vw, 34px); letter-spacing: .5px; }
		.brand small { display: block; font-family: monospace; font-size: 11px; letter-spacing: 2px; }
		.back { color: var(--ink); font-weight: bold; text-decoration: none; border-bottom: 3px solid var(--ink); }

		.game-card { overflow: hidden; background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 10px 10px 0 var(--ink); }
		.topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 20px; color: white; background: var(--ink); }
		.stat { font-family: monospace; font-weight: bold; font-size: 15px; letter-spacing: 1px; }
		.stat strong { color: var(--yellow); font-size: 20px; }
		.health { display: inline-block; width: min(220px, 35vw); height: 14px; overflow: hidden; vertical-align: middle; background: #4d5361; border: 2px solid white; border-radius: 2px; }
		#healthFill { display: block; width: 100%; height: 100%; background: var(--teal); transition: width .2s; }

		.arena-wrap { position: relative; padding: 14px; background: #a9e5dc; background-image: linear-gradient(45deg, rgba(255,255,255,.22) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.22) 75%); background-size: 28px 28px; }
		canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #89d8df; border: 4px solid var(--ink); cursor: crosshair; image-rendering: auto; }
		.overlay { position: absolute; inset: 14px; display: grid; place-items: center; pointer-events: none; }
		.message { max-width: 440px; padding: 22px; text-align: center; color: white; background: rgba(20,26,39,.94); border: 3px solid white; box-shadow: 7px 7px 0 var(--coral); pointer-events: auto; }
		.message h2 { margin: 0 0 8px; color: var(--yellow); font-size: clamp(25px, 5vw, 43px); }
		.message p { margin: 7px 0 17px; font-family: monospace; line-height: 1.5; }
		button { border: 3px solid var(--ink); border-radius: 5px; padding: 11px 17px; color: var(--ink); background: var(--yellow); font: bold 15px "Trebuchet MS", sans-serif; cursor: pointer; box-shadow: 3px 3px 0 var(--coral); }
		button:hover, button:focus-visible { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--coral); }

		.controls { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 20px; border-top: 3px solid var(--ink); font-family: monospace; font-size: 13px; }
		.hint { line-height: 1.5; }
		.hint b { color: var(--blue); }
		.modes { display: flex; gap: 8px; padding: 13px 20px 0; background: var(--paper); }
		.mode { flex: 1; padding: 9px 10px; color: var(--ink); background: transparent; box-shadow: none; font-size: 12px; }
		.mode.selected { color: white; background: var(--coral); }
		.characters { display: flex; gap: 8px; }
		.character { width: 82px; padding: 7px 5px; background: white; font-size: 11px; box-shadow: none; }
		.character.selected { color: white; background: var(--blue); }
		.avatar { display: block; margin-bottom: 3px; font-size: 25px; }

		@media (max-width: 650px) {
			.shell { width: min(100% - 18px, 1120px); padding-top: 16px; }
			header { align-items: flex-start; }
			.back { font-size: 12px; }
			.topbar { flex-wrap: wrap; padding: 12px; }
			.arena-wrap { padding: 8px; }
			.overlay { inset: 8px; }
			.controls { align-items: stretch; flex-direction: column; padding: 12px; }
			.modes { flex-wrap: wrap; padding: 10px 12px 0; }
			.mode { flex: 1 1 30%; font-size: 10px; }
			.characters { width: 100%; }
			.character { flex: 1; }
		}
	</style>
</head>
<body>
	<main class="shell">
		<header>
			<div class="brand"><span class="brand-mark">✦</span><div><small>HYPEVAULT PRESENTS</small><h1>TOON NETWORK: NEON ARCADE</h1></div></div>
			<a class="back" href="index.html">Back to Vault</a>
		</header>

		<section class="game-card" aria-label="Neon Arcade shooting game">
			<div class="topbar">
				<span class="stat">SCORE <strong id="score">0000</strong></span>
				<span class="stat">WAVE <strong id="wave">01</strong></span>
				<span class="stat">HP <span class="health"><i id="healthFill"></i></span></span>
			</div>
			<div class="arena-wrap">
				<canvas id="arena" width="960" height="540" aria-label="Game arena. Move and shoot targets here."></canvas>
				<div class="overlay" id="overlay">
					<div class="message">
						<h2>READY, HERO?</h2>
						<p>Zap the glitch-bots before they reach your side. Move with WASD or arrows. Aim and fire with your mouse or tap the arena.</p>
						<button id="startButton">START MISSION</button>
					</div>
				</div>
			</div>
			<div class="modes" aria-label="Choose a mini game">
				<button class="mode selected" data-mode="blast">✦ GLITCH BLAST</button>
				<button class="mode" data-mode="catch">★ STAR CATCH</button>
				<button class="mode" data-mode="dodge">↯ DODGE DASH</button>
			</div>
			<div class="controls">
				<div class="hint"><b>MOVE</b> WASD / ARROWS &nbsp; <b>FIRE</b> MOUSE / TAP</div>
				<div class="characters" aria-label="Choose a hero">
					<button class="character selected" data-hero="Finn"><span class="avatar">🧢</span>FINN</button>
					<button class="character" data-hero="Ben"><span class="avatar">⌚</span>BEN 10</button>
					<button class="character" data-hero="Gumball"><span class="avatar">🐱</span>GUMBALL</button>
				</div>
			</div>
		</section>
	</main>
	<script>
		const canvas = document.getElementById('arena');
		const context = canvas.getContext('2d');
		const overlay = document.getElementById('overlay');
		const scoreLabel = document.getElementById('score');
		const waveLabel = document.getElementById('wave');
		const healthFill = document.getElementById('healthFill');
		const keys = new Set();
		let heroName = 'Finn';
		let gameMode = 'blast';
		let running = false;
		let animationId;
		let lastFrame = 0;
		let score = 0;
		let health = 100;
		let wave = 1;
		let spawnClock = 0;
		let shots = [];
		let enemies = [];
		let stars = [];
		const player = { x: 130, y: 270, radius: 22, speed: 280 };

		const heroColors = { Finn: '#3568f4', Ben: '#19b8a5', Gumball: '#ff6b55' };
		const heroFaces = { Finn: '◉', Ben: '⌁', Gumball: '•ᴥ•' };

		function resizeCanvasPoint(event) {
			const bounds = canvas.getBoundingClientRect();
			return { x: (event.clientX - bounds.left) * canvas.width / bounds.width, y: (event.clientY - bounds.top) * canvas.height / bounds.height };
		}

		function shoot(target) {
			if (!running || gameMode !== 'blast') return;
			const angle = Math.atan2(target.y - player.y, target.x - player.x);
			shots.push({ x: player.x + Math.cos(angle) * 25, y: player.y + Math.sin(angle) * 25, vx: Math.cos(angle) * 620, vy: Math.sin(angle) * 620, life: 1 });
		}

		function spawnEnemy() {
			enemies.push({ x: canvas.width + 30, y: 50 + Math.random() * (canvas.height - 100), radius: 17 + Math.random() * 7, speed: 55 + wave * 8 + Math.random() * 35, wobble: Math.random() * 6.28, color: Math.random() > .5 ? '#ff6b55' : '#8b5cf6' });
		}

		function resetGame() {
			score = 0; health = 100; wave = 1; spawnClock = 0; shots = []; enemies = []; stars = [];
			player.x = 130; player.y = canvas.height / 2;
			updateHud();
		}

		function startGame() {
			resetGame(); running = true; overlay.style.display = 'none'; lastFrame = performance.now(); cancelAnimationFrame(animationId); animationId = requestAnimationFrame(loop);
		}

		function updateHud() {
			scoreLabel.textContent = String(score).padStart(4, '0');
			waveLabel.textContent = String(wave).padStart(2, '0');
			healthFill.style.width = `${Math.max(health, 0)}%`;
			healthFill.style.background = health < 35 ? '#ff6b55' : '#19b8a5';
		}

		function update(delta) {
			const horizontal = (keys.has('ArrowRight') || keys.has('d') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('a') ? 1 : 0);
			const vertical = (keys.has('ArrowDown') || keys.has('s') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('w') ? 1 : 0);
			player.x = Math.max(35, Math.min(canvas.width - 35, player.x + horizontal * player.speed * delta));
			player.y = Math.max(35, Math.min(canvas.height - 35, player.y + vertical * player.speed * delta));
			spawnClock += delta;
			if (spawnClock > Math.max(.35, 1.15 - wave * .06)) {
				spawnClock = 0;
				if (gameMode === 'blast' || gameMode === 'dodge') spawnEnemy();
				if (gameMode === 'catch') stars.push({ x: canvas.width + 20, y: 45 + Math.random() * (canvas.height - 90), radius: 13, speed: 90 + wave * 8, spin: 0 });
			}
			shots.forEach(shot => { shot.x += shot.vx * delta; shot.y += shot.vy * delta; shot.life -= delta; });
			enemies.forEach(enemy => { enemy.x -= enemy.speed * delta; enemy.y += Math.sin(enemy.wobble + enemy.x / 35) * 18 * delta; });
			stars.forEach(star => { star.x -= star.speed * delta; star.spin += delta * 5; });
			shots = shots.filter(shot => shot.life > 0 && shot.x < canvas.width + 20 && shot.y > -20 && shot.y < canvas.height + 20);
			enemies = enemies.filter(enemy => {
				if (gameMode === 'catch') return true;
				if (enemy.x < 0) { health -= 10; updateHud(); return false; }
				if (gameMode === 'dodge' && Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.radius + player.radius) { health -= 25; updateHud(); return false; }
				for (const shot of shots) {
					if (Math.hypot(enemy.x - shot.x, enemy.y - shot.y) < enemy.radius + 7) { score += 10; wave = 1 + Math.floor(score / 100); updateHud(); shot.life = 0; return false; }
				}
				return true;
			});
			stars = stars.filter(star => {
				if (star.x < -20) { health -= 5; updateHud(); return false; }
				if (Math.hypot(star.x - player.x, star.y - player.y) < star.radius + player.radius) { score += 15; wave = 1 + Math.floor(score / 100); updateHud(); return false; }
				return true;
			});
			if (health <= 0) endGame();
		}

		function draw() {
			context.clearRect(0, 0, canvas.width, canvas.height);
			context.fillStyle = '#89d8df'; context.fillRect(0, 0, canvas.width, canvas.height);
			context.strokeStyle = 'rgba(20,26,39,.12)'; context.lineWidth = 2;
			for (let x = 0; x < canvas.width; x += 48) { context.beginPath(); context.moveTo(x, 0); context.lineTo(x, canvas.height); context.stroke(); }
			for (let y = 0; y < canvas.height; y += 48) { context.beginPath(); context.moveTo(0, y); context.lineTo(canvas.width, y); context.stroke(); }
			context.fillStyle = '#ffd447'; context.fillRect(0, 0, 15, canvas.height);
			shots.forEach(shot => { context.fillStyle = '#fff'; context.beginPath(); context.arc(shot.x, shot.y, 7, 0, Math.PI * 2); context.fill(); context.fillStyle = '#ff6b55'; context.beginPath(); context.arc(shot.x, shot.y, 4, 0, Math.PI * 2); context.fill(); });
			enemies.forEach(enemy => { context.fillStyle = enemy.color; context.beginPath(); context.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2); context.fill(); context.strokeStyle = '#141a27'; context.lineWidth = 4; context.stroke(); context.fillStyle = '#fff'; context.fillRect(enemy.x - 8, enemy.y - 5, 5, 7); context.fillRect(enemy.x + 3, enemy.y - 5, 5, 7); context.fillStyle = '#141a27'; context.fillRect(enemy.x - 6, enemy.y + 7, 12, 3); });
			stars.forEach(star => { context.save(); context.translate(star.x, star.y); context.rotate(star.spin); context.fillStyle = '#ffd447'; context.strokeStyle = '#141a27'; context.lineWidth = 4; context.beginPath(); for (let point = 0; point < 10; point++) { const radius = point % 2 ? 6 : 15; const angle = point * Math.PI / 5; context.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius); } context.closePath(); context.fill(); context.stroke(); context.restore(); });
			context.fillStyle = heroColors[heroName]; context.beginPath(); context.arc(player.x, player.y, player.radius, 0, Math.PI * 2); context.fill(); context.strokeStyle = '#141a27'; context.lineWidth = 5; context.stroke(); context.fillStyle = '#fff'; context.font = 'bold 17px monospace'; context.textAlign = 'center'; context.textBaseline = 'middle'; context.fillText(heroFaces[heroName], player.x, player.y); context.fillStyle = '#141a27'; context.font = 'bold 12px monospace'; context.fillText(heroName.toUpperCase(), player.x, player.y + 37);
		}

		function loop(time) { const delta = Math.min((time - lastFrame) / 1000, .05); lastFrame = time; update(delta); draw(); if (running) animationId = requestAnimationFrame(loop); }
		function endGame() { running = false; overlay.style.display = 'grid'; overlay.querySelector('h2').textContent = 'RUN COMPLETE'; overlay.querySelector('p').textContent = `Final score: ${score}. Pick a mode and jump back in for another run.`; document.getElementById('startButton').textContent = 'PLAY AGAIN'; }

		document.getElementById('startButton').addEventListener('click', startGame);
		document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => { gameMode = button.dataset.mode; document.querySelectorAll('.mode').forEach(item => item.classList.remove('selected')); button.classList.add('selected'); overlay.querySelector('h2').textContent = 'READY, HERO?'; overlay.querySelector('p').textContent = gameMode === 'blast' ? 'Zap the glitch-bots before they reach your side. Move with WASD or arrows. Aim and fire with your mouse or tap the arena.' : gameMode === 'catch' ? 'Collect the spinning stars with your hero. Move with WASD or arrows and catch as many as you can.' : 'Dodge the glitch-bots as they rush in. Move with WASD or arrows and survive the wave.'; }));
		document.querySelectorAll('.character').forEach(button => button.addEventListener('click', () => { heroName = button.dataset.hero; document.querySelectorAll('.character').forEach(item => item.classList.remove('selected')); button.classList.add('selected'); }));
		window.addEventListener('keydown', event => { keys.add(event.key); if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault(); });
		window.addEventListener('keyup', event => keys.delete(event.key));
		canvas.addEventListener('click', event => shoot(resizeCanvasPoint(event)));
		canvas.addEventListener('touchstart', event => { event.preventDefault(); shoot(resizeCanvasPoint(event.touches[0])); }, { passive: false });
		draw();
	</script>
</body>
</html>
